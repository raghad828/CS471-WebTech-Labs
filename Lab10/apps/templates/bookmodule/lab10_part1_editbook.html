{% extends "layouts/base.html" %}
{% load static %}
{% block title %} Lab 10 Part 1 - Edit Book {% endblock title %}

{% block content %}
    <h1>Lab 10 Part 1 - Edit Book</h1>
    <form method="post" action="">
        {% csrf_token %}
        <label>Title:</label>
        <input type="text" name="title" maxlength="50" value="{{book.title}}" required/>
        <br/>

        <label>Author:</label>
        <input type="text" name="author" maxlength="50" value="{{book.author}}" required/>
        <br/>

        <label>Price:</label>
        <input type="number" name="price" step="0.01" value="{{book.price}}" required/>
        <br/>

        <label>Edition:</label>
        <input type="number" name="edition" value="{{book.edition}}" required/>
        <br/>

        <button type="submit">Update</button>
    </form>
{% endblock content %}
